# Runs on every push and uploads a build as a plain Actions artifact - never a GitHub Release.
# Uses the debug build type, which Android Gradle Plugin signs automatically with its built-in
# debug keystore, so no signing secrets are needed for this workflow. Stable releases are a
# separate, manually-triggered workflow (release_build.yml).
name: Nightly Build

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Upload
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      # The repo's gradlew was committed without its executable bit (a known issue with
      # files added via GitHub's web upload), so runners refuse to execute it directly.
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Locate built APK
        id: apk
        run: |
          set -e
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -iname '*.apk' | head -n1)
          if [ -z "$APK" ]; then
            echo "::error::No debug APK found under app/build/outputs/apk/debug." >&2
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      # 14-day retention: this builds on every push, so a longer retention would pile up
      # storage for builds nobody's likely to grab once the next one lands.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pear-nightly-${{ github.sha }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 14
